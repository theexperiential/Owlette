version: 2

# Version updates target `dev`, where all work lands before promotion to `main`.
# `target-branch` does not apply to security updates: GitHub always raises those
# against the default branch (`main`), so a security PR lands on `dev` by hand.

updates:
  # GitHub Actions across all workflows (.github/workflows/*), grouped into one
  # weekly PR. Dependabot bumps version tags today; once actions are pinned to
  # SHAs it bumps the SHA and its trailing "# vX" comment together.
  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns:
          - "*"
    commit-message:
      prefix: ci

  # Node dependencies. Each of these has its own package-lock.json: the repo
  # root (an npm workspace that also owns cli/ and sdks/node/), the desktop
  # shell's frontend, the Cloud Functions, and the web app. Minor/patch bumps
  # are grouped; majors open their own PR.
  - package-ecosystem: npm
    directories:
      - /
      - /desktop
      - /functions
      - /web
    target-branch: dev
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      npm-minor-patch:
        update-types:
          - minor
          - patch
    commit-message:
      prefix: deps

  # Rust crates: the owlette-host service wrapper and the Tauri desktop app.
  - package-ecosystem: cargo
    directories:
      - /agent/host
      - /desktop/src-tauri
    target-branch: dev
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      cargo-minor-patch:
        update-types:
          - minor
          - patch
    commit-message:
      prefix: deps

  # Python dependencies: the agent, the published Python SDK, and the
  # integration / agent-runner test harnesses.
  - package-ecosystem: pip
    directories:
      - /agent
      - /sdks/python
      - /test/integration
      - /test/infra/agent-runner
    target-branch: dev
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      pip-minor-patch:
        update-types:
          - minor
          - patch
    commit-message:
      prefix: deps
